name: Portfolio quality
on:
  push:
    branches: [main, test-run-portfolio-rebuild]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check js/main.js
      - name: Run static checks
        run: node --test tests/site.test.mjs
      - name: Check source budget
        run: node scripts/check-size.mjs
